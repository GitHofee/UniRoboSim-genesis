name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify version
        run: |
          python - <<'PYCODE'
          import os, tomllib
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version
          PYCODE
      - run: python -m pip install build
      - run: python -m build
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum dist/* > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" dist/* SHA256SUMS --verify-tag --title "UniRoboSim Genesis $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
